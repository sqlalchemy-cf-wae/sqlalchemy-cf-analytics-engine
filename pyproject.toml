[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "sqlalchemy-cf-analytics-engine"
version = "0.0.1"
description = "Read-only DBAPI driver and SQLAlchemy dialect for Cloudflare Workers Analytics Engine"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27, <1",
    "sqlalchemy>=2.0, <3",
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/PrithviSeran/sqlalchemy-cf-analytics-engine"

# Registers the dialect so `create_engine("cfwae://...")` finds it.
# SQLAlchemy looks up "cfwae" for a bare `cfwae://` URI and "cfwae.httpx"
# for `cfwae+httpx://`, so both names point at the same class.
[project.entry-points."sqlalchemy.dialects"]
cfwae = "sqlalchemy_cf_analytics_engine.dialect:CloudflareAnalyticsEngineDialect"
"cfwae.httpx" = "sqlalchemy_cf_analytics_engine.dialect:CloudflareAnalyticsEngineDialect"

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_cf_analytics_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
