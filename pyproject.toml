[project]
name = "sqlalchemy-cf-analytics-engine"
version = "0.0.1"
description = "Read-only DBAPI driver and SQLAlchemy dialect for Cloudflare Workers Analytics Engine"
readme = "README.md"
license = "Apache-2.0"
authors = [
    {name = "Prithvi Seran"},
    {name = "Eva Abdul"},
    {name = "Dibya Jyoti Goswami"},
    {name = "Jonathan Manuel"},
]
license-files = ["LICENSE"]
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "httpx>=0.27, <1",
    "sqlalchemy>=2.0, <3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.16.8,<0.17.0",
]

[project.urls]
Homepage = "https://github.com/sqlalchemy-cf-wae/sqlalchemy-cf-analytics-engine"

[project.entry-points."sqlalchemy.dialects"]
cfwae = "sqlalchemy_cf_analytics_engine.dialect:CloudflareAnalyticsEngineDialect"
"cfwae.httpx" = "sqlalchemy_cf_analytics_engine.dialect:CloudflareAnalyticsEngineDialect"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sqlalchemy_cf_analytics_engine"]

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"
